<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>

    <!-- Base gradient: warm cream -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FAF7F2"/>
      <stop offset="55%"  stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#EADECF"/>
    </linearGradient>

    <!-- Subtle warm overlay on right -->
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#F0E0CC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine dot matrix -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#B8A090" opacity="0.18"/>
    </pattern>

    <!-- Orthogonal grid -->
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#D4C4B0" stroke-width="0.4" opacity="0.55"/>
    </pattern>

  </defs>

  <!-- ── Base layers ─────────────────────────────── -->
  <rect width="1440" height="900" fill="url(#base)"/>
  <rect width="1440" height="900" fill="url(#dots)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- ── Large concentric circles (right) ────────── -->
  <circle cx="1180" cy="430" r="560" fill="none" stroke="#D4BFA8" stroke-width="0.8" opacity="0.5"/>
  <circle cx="1180" cy="430" r="440" fill="none" stroke="#D4BFA8" stroke-width="0.6" opacity="0.45"/>
  <circle cx="1180" cy="430" r="320" fill="none" stroke="#C8521A"  stroke-width="0.5" opacity="0.12"/>
  <circle cx="1180" cy="430" r="200" fill="none" stroke="#C8521A"  stroke-width="0.5" opacity="0.08"/>
  <!-- Filled inner circle for subtle depth -->
  <circle cx="1180" cy="430" r="80"  fill="#C8521A" opacity="0.03"/>

  <!-- ── Diagonal composition lines ──────────────── -->
  <line x1="340" y1="0"   x2="1440" y2="780" stroke="#C8BAA8" stroke-width="0.8" opacity="0.35"/>
  <line x1="420" y1="0"   x2="1440" y2="660" stroke="#C8BAA8" stroke-width="0.4" opacity="0.25"/>
  <line x1="520" y1="0"   x2="1440" y2="560" stroke="#C8BAA8" stroke-width="0.3" opacity="0.18"/>

  <!-- ── Left edge accent bar ─────────────────────── -->
  <rect x="0" y="0" width="3" height="900" fill="#C8521A" opacity="0.18"/>
  <rect x="3" y="0" width="1" height="900" fill="#C8521A" opacity="0.06"/>

  <!-- ── Orange horizontal accents (left mid) ──────── -->
  <line x1="52" y1="220" x2="220" y2="220" stroke="#C8521A" stroke-width="1"   opacity="0.22"/>
  <line x1="52" y1="230" x2="140" y2="230" stroke="#C8521A" stroke-width="0.5" opacity="0.14"/>
  <circle cx="48" cy="220" r="3" fill="#C8521A" opacity="0.3"/>

  <!-- ── Bottom accent ─────────────────────────────── -->
  <line x1="52"  y1="680" x2="180" y2="680" stroke="#C8521A" stroke-width="0.8" opacity="0.15"/>
  <line x1="52"  y1="688" x2="120" y2="688" stroke="#C8521A" stroke-width="0.4" opacity="0.10"/>

  <!-- ── Abstract rectangular blocks (top right) ────── -->
  <rect x="1280" y="40"  width="120" height="1"   fill="#C8521A" opacity="0.12"/>
  <rect x="1380" y="20"  width="1"   height="100" fill="#C8521A" opacity="0.10"/>
  <rect x="1300" y="55"  width="60"  height="0.5" fill="#8B7355" opacity="0.15"/>

  <!-- ── Corner fills ───────────────────────────────── -->
  <path d="M 1440 0 L 1100 0 L 1440 300 Z" fill="#C8521A" opacity="0.025"/>
  <path d="M 0 900 L 380 900 L 0 580 Z"    fill="#3D2010"  opacity="0.025"/>

  <!-- ── Horizontal rule near bottom ───────────────── -->
  <line x1="0" y1="870" x2="1440" y2="870" stroke="#D4C4B0" stroke-width="0.5" opacity="0.4"/>

  <!-- ── Fine vertical marks (right side) ─────────── -->
  <line x1="1360" y1="820" x2="1360" y2="870" stroke="#C8521A" stroke-width="0.8" opacity="0.15"/>
  <line x1="1380" y1="840" x2="1380" y2="870" stroke="#C8521A" stroke-width="0.5" opacity="0.10"/>
  <line x1="1400" y1="855" x2="1400" y2="870" stroke="#C8521A" stroke-width="0.5" opacity="0.08"/>

</svg>
